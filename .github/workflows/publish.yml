name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'rms-pro/gve' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-dry-run.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: gve-release-dry-run
          path: artifacts
      - name: Publish verified archives in dependency order
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a MAJOR.MINOR.PATCH release version"
            exit 1
          fi
          packages=(core themes algorithms renderers runtime react)
          for package in "${packages[@]}"; do
            test -f "artifacts/gvejs-${package}-${RELEASE_VERSION}.tgz"
          done
          for package in "${packages[@]}"; do
            npm publish "./artifacts/gvejs-${package}-${RELEASE_VERSION}.tgz" --access public
          done
